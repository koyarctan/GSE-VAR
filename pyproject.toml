[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "gse-var"
version = "0.1.0"
description = "GSE-VAR: Gated Self-Explaining Vector Autoregression with sparse Granger structure learning and exogenous inputs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
]


[project.urls]
Repository = "https://github.com/koyarctan/GSE-VAR"


[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]

benchmark = [
    "matplotlib>=3.7",
    "scipy>=1.10",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["gse_var*", "xneural_var*"]
exclude = [
    "slides*",
    "figures*",
    "experiments*",
    "tests*",
]
namespaces = false
